services:
  - type: web
    name: resume-analyzer-backend
    env: node
    plan: free
    buildCommand: npm install && npm run build:server
    startCommand: npm run start:server
    envVars:
      - key: REDIS_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://resume-analyser-upgraded.vercel.app # Your Vercel domain to allow CORS
      - key: PORT
        value: 10000
